<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="description" content="Car for sale">
<title>For Sale — Jay Stroud</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@500;600&family=Space+Grotesk:wght@400;500;600&family=Lora:wght@400;500;600&family=Inter:wght@400;500;600&family=Source+Sans+3:wght@400;500;600&display=swap" rel="stylesheet">
<style>
  :root {
    --bg: #f6f1e8;
    --border: #ddd0ba;
    --accent: #b5572e;
    --accent-hover: #8f4322;
    --ink: #2b2622;
    --body-ink: #4a423a;
    --muted: #8a8073;
    --heading-font: 'Playfair Display', serif;
    --heading-weight: 500;
    --body-font: 'Inter', system-ui, sans-serif;
    --space: 1;
  }
  @keyframes fadeUp { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: translateY(0); } }
  body { margin: 0; background: var(--bg); font-family: var(--body-font); color: var(--ink); transition: background .3s ease, color .3s ease; }
  a { color: var(--accent); }
  a:hover { color: var(--accent-hover); }
  ::selection { background: #e3c6a8; }
  h1, .heading { font-family: var(--heading-font); font-weight: var(--heading-weight); }
  .page { animation: fadeUp 0.5s ease both; }
  .navlink { padding: 2px 0; font-family: var(--body-font); font-size: 14px; font-weight: 500; color: var(--muted); border-bottom: 1px solid transparent; text-decoration: none; }
  .navlink:hover { color: var(--ink); }
  .navlink.active { color: var(--ink); border-bottom: 1px solid var(--ink); }
  .eyebrow { font-size: 13px; letter-spacing: 0.14em; text-transform: uppercase; color: var(--accent); font-weight: 600; margin-bottom: 20px; }
  .muted { color: var(--muted); }
  .body-ink { color: var(--body-ink); }

  .spec { border-top: 1px solid var(--border); padding: 18px 0; display: flex; align-items: baseline; justify-content: space-between; gap: 24px; }
  .spec:last-of-type { border-bottom: 1px solid var(--border); }
  .spec-label { font-size: 11.5px; letter-spacing: 0.12em; text-transform: uppercase; color: var(--muted); font-weight: 600; }
  .spec-value { font-size: 17px; color: var(--ink); text-align: right; }

  #car-grid img { width: 100%; aspect-ratio: 4/3; object-fit: cover; display: block; cursor: zoom-in; transition: opacity .2s ease; }
  #car-grid img:hover { opacity: 0.82; }

  #lightbox { position: fixed; inset: 0; z-index: 200; background: rgba(30,26,22,0.94); display: none; align-items: center; justify-content: center; cursor: zoom-out; }
  #lightbox.open { display: flex; }
  #lightbox img { max-width: 92vw; max-height: 88vh; object-fit: contain; }
  .lb-nav { position: absolute; top: 50%; transform: translateY(-50%); background: none; border: none; color: #f6f1e8; font-size: 40px; padding: 12px 22px; cursor: pointer; opacity: 0.65; }
  .lb-nav:hover { opacity: 1; }
</style>
</head>
<body>

<div style="min-height:100vh;">

  <nav style="position:sticky;top:0;z-index:10;display:flex;align-items:center;justify-content:space-between;padding:28px 64px;background:var(--bg);backdrop-filter:blur(8px);border-bottom:1px solid var(--border);opacity:0.97;">
    <a class="heading" href="./index.html" style="font-size:18px;letter-spacing:0.01em;color:var(--ink);text-decoration:none;">Jay Stroud</a>
    <div style="display:flex;gap:36px;white-space:nowrap;">
      <a class="navlink" href="./index.html">About</a>
      <a class="navlink" href="./index.html">Gallery</a>
      <a class="navlink" href="./index.html">Resources</a>
      <a class="navlink active" href="./car.html">For Sale</a>
    </div>
  </nav>

  <main class="page" style="max-width:1080px;margin:0 auto;padding:96px 64px 140px;">

    <div class="eyebrow">For Sale</div>
    <h1 id="car-title" style="font-size:56px;margin:0 0 12px;line-height:1.05;letter-spacing:-0.01em;"></h1>
    <div id="car-price" style="font-size:30px;color:var(--accent);font-weight:600;margin:0 0 56px;"></div>

    <div style="display:grid;grid-template-columns:1fr 0.9fr;gap:72px;align-items:start;">
      <div>
        <div class="heading" style="font-size:22px;margin-bottom:20px;">Description</div>
        <p id="car-description" class="body-ink" style="font-size:12px;line-height:1.85;margin:0;white-space:pre-line;"></p>
      </div>
      <div>
        <div class="heading" style="font-size:22px;margin-bottom:20px;">Details</div>
        <div class="spec"><span class="spec-label">Year / Make / Model</span><span class="spec-value" id="spec-ymm"></span></div>
        <div class="spec"><span class="spec-label">Mileage</span><span class="spec-value" id="spec-mileage"></span></div>
        <div class="spec"><span class="spec-label">Color</span><span class="spec-value" id="spec-color"></span></div>
        <div class="spec"><span class="spec-label">Price</span><span class="spec-value" id="spec-price"></span></div>
        <a id="car-contact" href="mailto:you@example.com?subject=Car%20for%20sale" style="display:inline-block;margin-top:32px;background:var(--accent);color:#f6f1e8;padding:13px 28px;border-radius:2px;font-size:14.5px;font-weight:600;text-decoration:none;">Contact me</a>
      </div>
    </div>

    <div class="heading" style="font-size:22px;margin:44px 0 20px;">Photos</div>
    <div id="car-grid" style="display:grid;grid-template-columns:repeat(3,1fr);gap:6px;"></div>

  </main>

  <footer class="muted" style="border-top:1px solid var(--border);padding:32px 64px;text-align:center;font-size:13px;">
    © 2026 Jay Stroud
  </footer>

</div>

<div id="lightbox">
  <button class="lb-nav" style="left:8px;" onclick="lbStep(-1,event)">‹</button>
  <img id="lb-img" alt="">
  <button class="lb-nav" style="right:8px;" onclick="lbStep(1,event)">›</button>
</div>

<script>
  /* ─────────── EDIT YOUR LISTING HERE ─────────── */
  var CAR = {
    yearMakeModel: '2018 BMW 430i GranCoupe',
    yearMakeModelLong: '2018 BMW 430i GranCoupe (build date 10/2017)',
    mileage: '56,200',
    color: 'Glacier Silver Metallic / Black with red stitching',
    price: '$15,500',
    priceLong: '$15,500 (cash or certified bank check only)',
    contactEmail: 'jayemstroud@gmail.com',
    description:
      "If you're looking for an affordable car with low miles and in great condition, this is the one for you! Elderly single owner family member who can no longer drive. Serviced by BMW except for the last oil change that I performed at 55.5K with Liqui Moly products. I have a Carfax that documents the service history. Motor is the turbo 4 cyclinder (reliable B48). It is loaded with a number of options like most BMW's. Has two keys.\n\nComes with two sets of tires and wheels that are the same style that you see in the pictures. Currently on the car is on 225/50R17's Michelin Cross Climates which have a softer ride which is what he wanted. Honestly it's the best riding car I've ever driven. The second set are larger 225/45R18's with performance tires (2 Pirelli's and 2 Michelin PilotSports). All have great tread depth.\n\nI have detailed the entire car (compound, polish & wax) and it is clean inside and out. Cosmetically the car is great but has two minor blemishes: 1) A dent in the right front fender where he scraped the side of the garage 2) rear bumper where he backed into something. I have cleaned up the fender with the detail and since the car is silver, it is not really noticeable. I also repaired and painted the rear bumper although I was unable to match the color perfectly due to age. However, both are much better than they were previously. There is also a small bit of red paint residue in a few areas inside the rear hatchback area on the carpet that I could not get out. None effect the car mechanically and are factored into the price.\n\nPlease feel free to come take a look and test drive."
  };

  /* Photo filenames — upload them to a /carphotos folder in the repo, then list them here. */
  var CAR_PHOTOS = [
    'car-01.jpg', 'car-02.jpg', 'car-03.jpg', 'car-04.jpg', 'car-05.jpg',
    'car-06.jpg', 'car-07.jpg', 'car-08.jpg', 'car-09.jpg', 'car-10.jpg',
    'car-11.jpg', 'car-12.jpg', 'car-13.jpg', 'car-14.jpg', 'car-15.jpg',
  ];
  var CAR_PHOTO_DIR = './carphotos/';
  /* ───────────────────────────────────────────── */

  document.getElementById('car-title').textContent = CAR.yearMakeModel;
  document.getElementById('car-price').textContent = CAR.price;
  document.getElementById('car-description').textContent = CAR.description;
  document.getElementById('spec-ymm').textContent = CAR.yearMakeModelLong || CAR.yearMakeModel;
  document.getElementById('spec-mileage').textContent = CAR.mileage;
  document.getElementById('spec-color').textContent = CAR.color;
  document.getElementById('spec-price').textContent = CAR.priceLong || CAR.price;
  document.getElementById('car-contact').href =
    'mailto:' + CAR.contactEmail + '?subject=' + encodeURIComponent(CAR.yearMakeModel + ' for sale');
  document.title = CAR.yearMakeModel + ' For Sale — Jay Stroud';

  var grid = document.getElementById('car-grid');
  CAR_PHOTOS.forEach(function (f, i) {
    var img = document.createElement('img');
    img.src = CAR_PHOTO_DIR + f;
    img.alt = CAR.yearMakeModel + ' photo ' + (i + 1);
    img.loading = 'lazy';
    img.onerror = function () { img.remove(); };   /* silently skip missing files */
    img.onclick = function () { lbOpen(i); };
    grid.appendChild(img);
  });

  var lb = document.getElementById('lightbox'), lbImg = document.getElementById('lb-img'), lbIndex = 0;
  function lbOpen(i) { lbIndex = i; lbImg.src = CAR_PHOTO_DIR + CAR_PHOTOS[i]; lb.classList.add('open'); }
  function lbStep(d, e) {
    if (e) e.stopPropagation();
    lbIndex = (lbIndex + d + CAR_PHOTOS.length) % CAR_PHOTOS.length;
    lbImg.src = CAR_PHOTO_DIR + CAR_PHOTOS[lbIndex];
  }
  lb.onclick = function () { lb.classList.remove('open'); };
  document.addEventListener('keydown', function (e) {
    if (!lb.classList.contains('open')) return;
    if (e.key === 'Escape') lb.classList.remove('open');
    if (e.key === 'ArrowLeft') lbStep(-1);
    if (e.key === 'ArrowRight') lbStep(1);
  });

  /* Match whatever look you picked in the Tweaks panel on the main site */
  var PALETTES = {
    terracotta: { bg:'#f6f1e8', border:'#ddd0ba', accent:'#b5572e', accentHover:'#8f4322', ink:'#2b2622', bodyInk:'#4a423a', muted:'#8a8073' },
    olive:      { bg:'#f0efe2', border:'#d9d6bd', accent:'#5f6b3a', accentHover:'#4a5430', ink:'#2a2b1f', bodyInk:'#464736', muted:'#83816c' },
    clay:       { bg:'#ece1d3', border:'#d6c4ab', accent:'#9c4a2e', accentHover:'#7a3a24', ink:'#2e2420', bodyInk:'#52413a', muted:'#8f7b6d' },
  };
  var TYPE = {
    editorial: { heading:"'Playfair Display',serif", weight:'500', body:"'Inter',system-ui,sans-serif" },
    modern:    { heading:"'Space Grotesk',sans-serif", weight:'500', body:"'Inter',system-ui,sans-serif" },
    classic:   { heading:"'Lora',serif", weight:'600', body:"'Source Sans 3',system-ui,sans-serif" },
  };
  try {
    var s = JSON.parse(localStorage.getItem('jstroud-site-tweaks') || 'null');
    if (s) {
      var r = document.documentElement.style, p = PALETTES[s.palette], t = TYPE[s.type];
      if (p) { r.setProperty('--bg',p.bg); r.setProperty('--border',p.border); r.setProperty('--accent',p.accent);
               r.setProperty('--accent-hover',p.accentHover); r.setProperty('--ink',p.ink);
               r.setProperty('--body-ink',p.bodyInk); r.setProperty('--muted',p.muted); }
      if (t) { r.setProperty('--heading-font',t.heading); r.setProperty('--heading-weight',t.weight); r.setProperty('--body-font',t.body); }
    }
  } catch (e) {}
</script>

</body>
</html>
